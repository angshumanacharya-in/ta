<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Redirecting...</title>
    <script>
        // Dynamically handles fallback routing within GitHub Pages repo structure (/ta/)
        const path = window.location.pathname;
        const validFolders = ['cs-dictionary', 'topics', 'cheat-sheet', 'notes', 'playables'];
        const matchedFolder = validFolders.find(folder => path.includes(folder));

        if (matchedFolder) {
            // Redirect cleanly back into the matched folder directory
            const basePath = path.split(matchedFolder)[0];
            window.location.replace(window.location.origin + basePath + matchedFolder + '/');
        } else {
            // Redirect safely back to the repository root (/ta/)
            const repoPath = path.startsWith('/ta') ? '/ta/' : './';
            window.location.replace(repoPath);
        }
    </script>
</head>
<body style="background-color: #1a1a1a; color: #ffffff; font-family: sans-serif; text-align: center; padding-top: 50px;">
    <h1>Page Not Found</h1>
    <p>Redirecting you to Tabspace Presentations...</p>
</body>
</html>
