<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Redirecting...</title>
    <script>
        // Check if the URL path was trying to access cs-dictionary
        const path = window.location.pathname;
        
        if (path.includes('cs-dictionary')) {
            // Redirect to the relative cs-dictionary index
            window.location.replace(window.location.origin + window.location.pathname.split('cs-dictionary')[0] + 'cs-dictionary/');
        } else {
            // Redirect back to main home page
            window.location.replace('/');
        }
    </script>
</head>
<body style="background-color: #1a1a1a; color: #ffffff; font-family: sans-serif; text-align: center; padding-top: 50px;">
    <h1>Page Not Found</h1>
    <p>Redirecting you to Tabspace Presentations...</p>
</body>
</html>
